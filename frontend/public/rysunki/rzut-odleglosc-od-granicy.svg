<title id="t">Odległość budynku od granicy działki — rzut</title>
<desc id="d">Rzut działki z góry. Budynek stoi ścianą z oknami w stronę lewej granicy, w odległości 4 m od niej, i ścianą bez okien w stronę górnej granicy, w odległości 3 m.</desc><style>.b{fill:none;stroke:#1f3a5f;stroke-width:2.5}.w{fill:#fdfcf9;stroke:#1f3a5f;stroke-width:1.5}.g{fill:none;stroke:#535a67;stroke-width:1.5;stroke-dasharray:10 4 2 4}.t{fill:none;stroke:#535a67;stroke-width:1.5}.d{fill:none;stroke:#b07f24;stroke-width:1.5}.m{fill:#1b2230;font:600 14px "PB Sans","Source Sans 3",sans-serif}.s{fill:#535a67;font:400 12px "PB Sans","Source Sans 3",sans-serif}.l{fill:#1b2230;font:400 13px "PB Sans","Source Sans 3",sans-serif}</style>

