[project]
name = "przepisy-backend"
version = "0.1.0"
description = "Przepisy budowlane w jednym miejscu — backend (modułowy monolit): rejestr aktów, adapter ELI, wersje, redakcja, wyszukiwarka i publiczne API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.140,<1",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0,<2.2",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
